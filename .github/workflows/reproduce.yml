name: Reproduce recorded results
on: [push, pull_request]
permissions:
  contents: read
jobs:
  invariants-and-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt -r requirements-external.txt -r requirements-measured.txt
      - run: python dlem_comparator.py
      - run: python -m unittest discover -s tests -v
      - run: python verify_joint_likelihood.py
      - run: python verify_clock_calibration.py
      - run: python study_capture_identifiability.py
      - run: python replay.py
      - run: python predict.py "3..P..>..<..2..P"
      - run: python train.py --mixer extrusion --steps 20 --n-train 200 --out "$RUNNER_TEMP/smoke.jsonl"
